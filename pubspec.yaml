name: ps2_bios_assistant
description: A local Android utility for inspecting PS2 BIOS files and emulator setup.
publish_to: "none"
version: 1.0.0+1
# Keep the version name in sync with lib/app_info.dart.

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  convert: ^3.1.2
  crypto: ^3.0.6
  file_picker: ^10.3.10
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
